[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "synapse-db"
version = "0.1.0"
description = "A high-performance database written in Rust with Python bindings"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Typing :: Typed",
]
keywords = ["database", "rust", "high-performance"]

[project.urls]
Homepage = "https://github.com/yourusername/synapse-db"
Documentation = "https://github.com/yourusername/synapse-db#readme"
Repository = "https://github.com/yourusername/synapse-db"
Issues = "https://github.com/yourusername/synapse-db/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "synapse_db"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyo3-stub-gen]
# Output directory for generated stubs
stub-out-path = "python/synapse_db"
